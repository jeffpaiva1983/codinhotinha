<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Codinhotinha</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   ROOT & RESET
══════════════════════════════════════════════ */
:root {
  --cat-trigger: #FFCC00;
  --cat-motion:  #5CB8FF;
  --cat-look:    #9B59B6;
  --cat-sound:   #2ECC71;
  --cat-control: #FF7F50;
  --cat-end:     #E74C3C;
  --cat-collide: #FF69B4;
  --toolbar-h: 52px;
  --bottom-h: 210px;
  --char-panel-w: 80px;
  --palette-w: 220px;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Fredoka One', cursive; }

/* ══════════════════════════════════════════════
   TOP TOOLBAR
══════════════════════════════════════════════ */
#toolbar {
  height: var(--toolbar-h);
  background: linear-gradient(to bottom, #2d2d44, #1e1e32);
  display: flex; align-items: center; padding: 0 12px; gap: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,.5);
  z-index: 10; position: relative;
}
#logo {
  font-size: 1.4rem; color: #FFE66D;
  text-shadow: 0 2px 8px rgba(255,230,109,.5);
  letter-spacing: 1px; flex-shrink: 0;
}
.tbtn {
  height: 36px; padding: 0 16px; border: none; border-radius: 20px;
  font-family: 'Fredoka One', cursive; font-size: .95rem; cursor: pointer;
  display: flex; align-items: center; gap: 6px; color: #fff;
  transition: transform .1s, filter .1s; box-shadow: 0 3px 0 rgba(0,0,0,.3);
  flex-shrink: 0;
}
.tbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
#btn-run   { background: #27AE60; }
#btn-run:hover { filter: brightness(1.15); }
#btn-stop  { background: #C0392B; }
#btn-reset { background: #2980B9; }
.speed-grp { display:flex; align-items:center; gap:6px; color:#aaa; font-size:.8rem; margin-left:4px; }
#speed { accent-color: #FFE66D; width: 70px; cursor: pointer; }
.spacer { flex: 1; }
#char-counter { color: #aaa; font-size: .8rem; font-family: 'Nunito', sans-serif; font-weight: 700; }

/* ══════════════════════════════════════════════
   MIDDLE = STAGE AREA
══════════════════════════════════════════════ */
#stage-area {
  position: absolute;
  top: var(--toolbar-h);
  left: 0; right: 0;
  bottom: var(--bottom-h);
  display: flex;
}

/* Character list panel (left of stage) */
#char-list-panel {
  width: var(--char-panel-w);
  background: #16213e;
  border-right: 3px solid #0f3460;
  display: flex; flex-direction: column;
  align-items: center; padding: 8px 4px; gap: 6px;
  overflow-y: auto;
}
.char-thumb {
  width: 60px; height: 60px; border-radius: 16px;
  background: #0f3460; border: 3px solid transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; cursor: pointer; position: relative;
  transition: border-color .15s, transform .15s;
  flex-shrink: 0;
}
.char-thumb:hover { transform: scale(1.08); }
.char-thumb.active { border-color: #FFE66D; background: #1a3a6e; }
.char-thumb .th-del {
  position: absolute; top: -5px; right: -5px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #E74C3C; color: #fff; border: none;
  font-size: .65rem; cursor: pointer; display: none;
  align-items: center; justify-content: center;
}
.char-thumb:hover .th-del { display: flex; }

#btn-add-char {
  width: 60px; height: 60px; border-radius: 16px;
  background: #0f3460; border: 2px dashed #5580aa;
  font-size: 1.6rem; color: #5580aa; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s, transform .15s; flex-shrink: 0;
}
#btn-add-char:hover { border-color: #FFE66D; color: #FFE66D; transform: scale(1.08); }

/* Emoji picker popup */
#emoji-popup {
  position: absolute; left: var(--char-panel-w); top: 0;
  background: #16213e; border: 3px solid #0f3460;
  border-radius: 0 16px 16px 0; padding: 10px;
  display: none; flex-wrap: wrap; gap: 5px; width: 230px;
  z-index: 50; box-shadow: 6px 4px 20px rgba(0,0,0,.5);
}
#emoji-popup.open { display: flex; }
.ep-emoji { font-size: 30px; cursor: pointer; padding: 4px; border-radius: 10px; transition: transform .12s; }
.ep-emoji:hover { transform: scale(1.3); background: rgba(255,255,255,.08); }

/* Stage */
#stage {
  flex: 1; position: relative; overflow: hidden;
  background: #87CEEB;
  background-image:
    linear-gradient(to bottom, #87CEEB 0%, #b0e0ff 55%, #90EE90 55%, #5aad5a 100%);
}
/* ground line */
#stage::after {
  content: ''; position: absolute; bottom: 45%; left: 0; right: 0;
  height: 0; pointer-events: none;
}
/* clouds decoration */
#stage::before {
  content: '☁️  ☁️    ☁️';
  position: absolute; top: 6%; left: 5%;
  font-size: 1.8rem; opacity: .7; pointer-events: none;
  letter-spacing: 20px;
}

/* Sprites */
.sprite {
  position: absolute; width: 80px; height: 80px;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; cursor: pointer;
  filter: drop-shadow(2px 4px 6px rgba(0,0,0,.25));
  transition: left .28s ease, top .28s ease;
}
.sprite.active-sprite {
  filter: drop-shadow(2px 4px 6px rgba(0,0,0,.25)) drop-shadow(0 0 10px #FFE66D);
}
.sprite.active-sprite::after {
  content: ''; position: absolute; inset: -8px;
  border: 3px dashed #FFE66D; border-radius: 50%;
  animation: selRing 2s linear infinite;
}
@keyframes selRing { to { transform: rotate(360deg); } }
.sprite.anim-bounce { animation: saBounce .4s ease; }
@keyframes saBounce { 0%,100%{transform:translateY(0)} 45%{transform:translateY(-24px)} }
.sprite.anim-spin   { animation: saSpin .5s ease; }
@keyframes saSpin   { to{transform:rotate(360deg)} }
.sprite.anim-shake  { animation: saShake .4s ease; }
@keyframes saShake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
.sprite.anim-grow   { animation: saGrow .4s ease; }
@keyframes saGrow   { 0%,100%{transform:scale(1)} 50%{transform:scale(1.6)} }
.sprite.collide-flash { animation: saFlash .5s ease 2; }
@keyframes saFlash  { 0%,100%{filter:drop-shadow(2px 4px 6px rgba(0,0,0,.25))} 50%{filter:drop-shadow(0 0 22px #FFE66D) brightness(1.6)} }

/* Speech bubble */
.bubble {
  position: absolute; background: #fff;
  border: 3px solid #FFB347; border-radius: 14px;
  padding: 5px 11px; font-family: 'Nunito', sans-serif; font-weight: 900;
  font-size: .75rem; color: #333; white-space: nowrap;
  pointer-events: none; z-index: 20;
  top: -52px; left: 50%; transform: translateX(-50%);
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.bubble::after {
  content: ''; position: absolute; bottom: -10px; left: 50%;
  transform: translateX(-50%); border: 5px solid transparent;
  border-top-color: #FFB347;
}

/* Collision stars */
.star-burst {
  position: absolute; pointer-events: none; z-index: 40;
  font-size: 1.4rem; transition: all .6s ease; opacity: 1;
}

/* ══════════════════════════════════════════════
   BOTTOM SECTION
══════════════════════════════════════════════ */
#bottom {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: var(--bottom-h);
  background: #16213e;
  border-top: 4px solid #0f3460;
  display: flex;
}

/* PALETTE */
#palette {
  width: var(--palette-w);
  background: #1a1a2e;
  border-right: 3px solid #0f3460;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Category tabs */
#cat-tabs {
  display: flex; background: #0f1628; border-bottom: 3px solid #0f3460;
  overflow-x: auto; flex-shrink: 0;
}
.cat-tab {
  flex: 1; min-width: 28px; padding: 6px 4px;
  border: none; cursor: pointer; font-size: 1.1rem;
  background: transparent; transition: background .15s;
  border-bottom: 3px solid transparent;
}
.cat-tab.active { border-bottom-color: #FFE66D; }
.cat-tab[data-cat="trigger"] { border-bottom-color: var(--cat-trigger); }
.cat-tab[data-cat="trigger"].active { background: rgba(255,204,0,.15); }
.cat-tab[data-cat="motion"] { border-bottom-color: var(--cat-motion); }
.cat-tab[data-cat="motion"].active  { background: rgba(92,184,255,.15); }
.cat-tab[data-cat="look"]   { border-bottom-color: var(--cat-look); }
.cat-tab[data-cat="look"].active    { background: rgba(155,89,182,.15); }
.cat-tab[data-cat="sound"]  { border-bottom-color: var(--cat-sound); }
.cat-tab[data-cat="sound"].active   { background: rgba(46,204,113,.15); }
.cat-tab[data-cat="control"]{ border-bottom-color: var(--cat-control); }
.cat-tab[data-cat="control"].active { background: rgba(255,127,80,.15); }
.cat-tab[data-cat="end"]    { border-bottom-color: var(--cat-end); }
.cat-tab[data-cat="end"].active     { background: rgba(231,76,60,.15); }
.cat-tab[data-cat="collide"]{ border-bottom-color: var(--cat-collide); }
.cat-tab[data-cat="collide"].active { background: rgba(255,105,180,.15); }

/* Block list */
#block-list {
  flex: 1; overflow-y: auto; padding: 8px;
  display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start;
}
.blk {
  border-radius: 14px; padding: 0;
  cursor: grab; transition: transform .12s, box-shadow .12s;
  box-shadow: 0 4px 0 rgba(0,0,0,.35);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px;
  width: 88px; height: 72px;
  font-size: .65rem; font-family: 'Nunito', sans-serif; font-weight: 900;
  color: rgba(255,255,255,.9);
  border: 2px solid rgba(255,255,255,.15);
}
.blk:hover { transform: scale(1.1) translateY(-2px); box-shadow: 0 7px 0 rgba(0,0,0,.35); }
.blk:active { cursor: grabbing; transform: scale(.97); }
.blk .blk-icon { font-size: 1.8rem; line-height: 1; }
.blk .blk-label { text-align: center; line-height: 1.1; padding: 0 4px; }

/* Category colors */
.blk.trigger { background: radial-gradient(circle at 30% 30%, #FFE066, #FFAA00); color: #5a3a00; }
.blk.motion  { background: radial-gradient(circle at 30% 30%, #7DD8FF, #2A90D9); }
.blk.look    { background: radial-gradient(circle at 30% 30%, #C39BF5, #7B2FBE); }
.blk.sound   { background: radial-gradient(circle at 30% 30%, #5FE891, #1E9E52); }
.blk.control { background: radial-gradient(circle at 30% 30%, #FFB07A, #E05A20); }
.blk.end     { background: radial-gradient(circle at 30% 30%, #FF7070, #C0392B); }
.blk.collide { background: radial-gradient(circle at 30% 30%, #FFB3D9, #E0559A); color: #4a0025; }

/* PROGRAMMING RAIL */
#prog-area {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: #1e1e32;
}
#prog-char-header {
  padding: 6px 14px; background: #0f1628; border-bottom: 3px solid #0f3460;
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
#prog-char-emoji { font-size: 1.5rem; }
#prog-char-label { font-size: .85rem; color: #aaa; font-family: 'Nunito',sans-serif; font-weight: 800; }
.btn-clear { margin-left: auto; background: #C0392B; color: #fff; border: none; border-radius: 20px; font-family: 'Fredoka One',cursive; font-size: .8rem; padding: 4px 12px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.btn-clear:active { transform: translateY(2px); }

/* RAIL */
#rail {
  flex: 1; overflow-x: auto; overflow-y: hidden;
  padding: 14px 16px;
  display: flex; align-items: center; gap: 0;
  position: relative;
}
#rail.drag-over { background: rgba(255,230,109,.06); }

/* Drop zone hint */
#rail-hint {
  color: #3a3a5a; font-family: 'Nunito',sans-serif; font-weight: 800;
  font-size: .9rem; white-space: nowrap; margin: auto;
  pointer-events: none;
}

/* Rail blocks (connected puzzle pieces) */
.rblk {
  height: 78px; min-width: 80px; padding: 0 10px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px;
  font-size: .62rem; font-family: 'Nunito',sans-serif; font-weight: 900;
  color: rgba(255,255,255,.95);
  cursor: default; position: relative; flex-shrink: 0;
  animation: railPop .18s cubic-bezier(.36,.07,.19,.97);
  clip-path: polygon(12px 0%, calc(100% - 0px) 0%, 100% 50%, calc(100% - 0px) 100%, 12px 100%, 0% 50%);
}
/* first block no left notch */
.rblk:first-child {
  clip-path: polygon(0% 0%, calc(100% - 0px) 0%, 100% 50%, calc(100% - 0px) 100%, 0% 100%);
  border-radius: 10px 0 0 10px;
}
/* overlap to connect */
.rblk + .rblk { margin-left: -10px; }
@keyframes railPop { from{transform:scale(.5) translateX(-20px);opacity:0} to{transform:scale(1) translateX(0);opacity:1} }

.rblk .rblk-icon { font-size: 1.5rem; line-height: 1; pointer-events: none; }
.rblk .rblk-label { text-align: center; line-height: 1.1; pointer-events: none; }
.rblk .rblk-del {
  position: absolute; top: -7px; right: -2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(0,0,0,.5); color: #fff; border: none;
  font-size: .6rem; cursor: pointer; display: none;
  align-items: center; justify-content: center; z-index: 5;
}
.rblk:hover .rblk-del { display: flex; }
.rblk.step-active { filter: brightness(1.5) drop-shadow(0 0 8px rgba(255,255,255,.8)); }

/* Colors for rail blocks */
.rblk.trigger { background: #FFAA00; color: #5a3a00; }
.rblk.motion  { background: #2A90D9; }
.rblk.look    { background: #7B2FBE; }
.rblk.sound   { background: #1E9E52; }
.rblk.control { background: #E05A20; }
.rblk.end     { background: #C0392B; }
.rblk.collide { background: #E0559A; color: #4a0025; }

/* scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,.04); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }
</style>
</head>
<body>

<!-- TOP TOOLBAR -->
<div id="toolbar">
  <div id="logo">⭐ Codinhotinha</div>
  <button class="tbtn" id="btn-run">▶ Executar</button>
  <button class="tbtn" id="btn-stop">■ Parar</button>
  <button class="tbtn" id="btn-reset">↺ Resetar</button>
  <div class="speed-grp">🐢 <input type="range" id="speed" min="1" max="5" value="3"> 🐇</div>
  <div class="spacer"></div>
  <div id="char-counter">0 personagens</div>
</div>

<!-- STAGE AREA -->
<div id="stage-area">
  <!-- Left: character list -->
  <div id="char-list-panel">
    <div id="emoji-popup"></div>
    <div id="btn-add-char" title="Adicionar personagem">＋</div>
  </div>
  <!-- Stage -->
  <div id="stage"></div>
</div>

<!-- BOTTOM -->
<div id="bottom">
  <!-- Palette -->
  <div id="palette">
    <div id="cat-tabs"></div>
    <div id="block-list"></div>
  </div>
  <!-- Programming rail -->
  <div id="prog-area">
    <div id="prog-char-header">
      <span id="prog-char-emoji">—</span>
      <span id="prog-char-label">Selecione um personagem</span>
      <button class="btn-clear" id="btn-clear">🗑 Limpar</button>
    </div>
    <div id="rail"><span id="rail-hint">⬅ Arraste blocos aqui para programar!</span></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   BLOCK DATA
═══════════════════════════════════════════ */
const CATS = {
  trigger: { icon:'⚡', label:'Início',   tab:'⚡' },
  motion:  { icon:'🏃', label:'Mover',    tab:'🏃' },
  look:    { icon:'👀', label:'Aparência',tab:'👀' },
  sound:   { icon:'💬', label:'Falar',    tab:'💬' },
  control: { icon:'🔁', label:'Controle', tab:'🔁' },
  end:     { icon:'🏁', label:'Fim',      tab:'🏁' },
  collide: { icon:'💥', label:'Colisão',  tab:'💥' },
};

const BLOCKS_DEF = [
  // TRIGGER
  { id:'on-start',  cat:'trigger', icon:'🟢', label:'Começar',    },
  { id:'on-tap',    cat:'trigger', icon:'👆', label:'Ao Tocar',   },
  // MOTION
  { id:'mv-right',  cat:'motion',  icon:'➡️', label:'Pra frente' },
  { id:'mv-left',   cat:'motion',  icon:'⬅️', label:'Pra trás'  },
  { id:'mv-up',     cat:'motion',  icon:'⬆️', label:'Subir'      },
  { id:'mv-down',   cat:'motion',  icon:'⬇️', label:'Descer'     },
  { id:'mv-home',   cat:'motion',  icon:'🏠', label:'Início'     },
  // LOOK
  { id:'lk-grow',   cat:'look',    icon:'🔺', label:'Crescer'    },
  { id:'lk-shrink', cat:'look',    icon:'🔻', label:'Encolher'   },
  { id:'lk-spin',   cat:'look',    icon:'🌀', label:'Girar'      },
  { id:'lk-bounce', cat:'look',    icon:'🦘', label:'Pular'      },
  { id:'lk-shake',  cat:'look',    icon:'💥', label:'Tremer'     },
  { id:'lk-hide',   cat:'look',    icon:'👻', label:'Esconder'   },
  { id:'lk-show',   cat:'look',    icon:'✨', label:'Aparecer'   },
  // SOUND (falar)
  { id:'say-oi',    cat:'sound',   icon:'👋', label:'Oi!'        },
  { id:'say-eba',   cat:'sound',   icon:'🎉', label:'Eba!'       },
  { id:'say-tchau', cat:'sound',   icon:'😊', label:'Tchau!'     },
  { id:'say-amor',  cat:'sound',   icon:'❤️', label:'Amigo!'    },
  // CONTROL
  { id:'ct-wait',   cat:'control', icon:'⏳', label:'Esperar'    },
  { id:'ct-rep2',   cat:'control', icon:'🔁', label:'2 vezes'    },
  { id:'ct-rep3',   cat:'control', icon:'🔁', label:'3 vezes'    },
  { id:'ct-rep5',   cat:'control', icon:'🔁', label:'5 vezes'    },
  // END
  { id:'en-stop',   cat:'end',     icon:'⏹', label:'Parar'      },
  { id:'en-happy',  cat:'end',     icon:'🎊', label:'Comemorar'  },
  // COLLIDE
  { id:'co-bounce', cat:'collide', icon:'🦘', label:'Pular ao colidir' },
  { id:'co-spin',   cat:'collide', icon:'🌀', label:'Girar ao colidir' },
  { id:'co-say',    cat:'collide', icon:'💬', label:'Falar ao colidir' },
  { id:'co-grow',   cat:'collide', icon:'🔺', label:'Crescer ao colidir'},
];

const EMOJIS = ['🐱','🐸','🐶','🦊','🐼','🦄','🐉','🚀','🦁','🐯','🐻','🐺',
                '🦋','🐝','🐙','🦀','🐬','🦖','👾','🤖','🧸','🎃','🐨','🦘'];

/* ═══════════════════════════════════════════
   BUILD PALETTE
═══════════════════════════════════════════ */
let activeCat = 'trigger';
const catTabsEl  = document.getElementById('cat-tabs');
const blockListEl = document.getElementById('block-list');

Object.keys(CATS).forEach(cat => {
  const t = document.createElement('button');
  t.className = 'cat-tab' + (cat === activeCat ? ' active' : '');
  t.dataset.cat = cat; t.title = CATS[cat].label;
  t.textContent = CATS[cat].tab;
  t.addEventListener('click', () => showCat(cat));
  catTabsEl.appendChild(t);
});

function showCat(cat) {
  activeCat = cat;
  catTabsEl.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  blockListEl.innerHTML = '';
  BLOCKS_DEF.filter(b => b.cat === cat).forEach(b => {
    const d = document.createElement('div');
    d.className = `blk ${b.cat}`; d.draggable = true; d.dataset.id = b.id;
    d.innerHTML = `<span class="blk-icon">${b.icon}</span><span class="blk-label">${b.label}</span>`;
    d.addEventListener('dragstart', e => { dragBlockId = b.id; e.dataTransfer.effectAllowed = 'copy'; });
    blockListEl.appendChild(d);
  });
}
showCat('trigger');

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let characters = [];
let activeId = null;
let isRunning = false, stopFlag = false;
let dragBlockId = null;
let collideHandled = new Set();
let speechTimers = {};
let charCounter = 0;

const stageEl    = document.getElementById('stage');
const railEl     = document.getElementById('rail');
const speedEl    = document.getElementById('speed');
const progEmoji  = document.getElementById('prog-char-emoji');
const progLabel  = document.getElementById('prog-char-label');
const hintEl     = document.getElementById('rail-hint');
const counterEl  = document.getElementById('char-counter');

/* ═══════════════════════════════════════════
   EMOJI PICKER
═══════════════════════════════════════════ */
const popupEl = document.getElementById('emoji-popup');
EMOJIS.forEach(em => {
  const d = document.createElement('div');
  d.className = 'ep-emoji'; d.textContent = em;
  d.addEventListener('click', () => { addChar(em); popupEl.classList.remove('open'); });
  popupEl.appendChild(d);
});
document.getElementById('btn-add-char').addEventListener('click', e => {
  e.stopPropagation(); popupEl.classList.toggle('open');
});
document.addEventListener('click', () => popupEl.classList.remove('open'));

/* ═══════════════════════════════════════════
   ADD / REMOVE CHARACTER
═══════════════════════════════════════════ */
const charPanel = document.getElementById('char-list-panel');

function addChar(emoji) {
  charCounter++;
  const id = 'c' + charCounter;
  const sw = stageEl.offsetWidth || 600;
  const sh = stageEl.offsetHeight || 300;
  // Spread positions
  const sx = 60 + ((characters.length % 5) * 110);
  const sy = sh * 0.4;

  const sprite = document.createElement('div');
  sprite.className = 'sprite'; sprite.id = id;
  sprite.textContent = emoji;
  sprite.style.left = sx + 'px'; sprite.style.top = sy + 'px';
  stageEl.appendChild(sprite);
  sprite.addEventListener('click', () => selectChar(id));

  const char = { id, emoji, x:sx, y:sy, sx, sy, scale:1, visible:true, sprite, sequence:[] };
  characters.push(char);

  // Thumb in panel
  const thumb = document.createElement('div');
  thumb.className = 'char-thumb'; thumb.id = 'th-'+id;
  thumb.title = emoji; thumb.textContent = emoji;
  const delb = document.createElement('button');
  delb.className = 'th-del'; delb.textContent = '✕';
  delb.addEventListener('click', e => { e.stopPropagation(); removeChar(id); });
  thumb.appendChild(delb);
  thumb.addEventListener('click', () => selectChar(id));
  charPanel.insertBefore(thumb, document.getElementById('btn-add-char'));

  selectChar(id);
  updateCounter();
}

function removeChar(id) {
  const idx = characters.findIndex(c => c.id === id);
  if (idx < 0) return;
  characters[idx].sprite.remove();
  document.getElementById('th-'+id)?.remove();
  characters.splice(idx, 1);
  if (activeId === id) {
    activeId = null;
    if (characters.length) selectChar(characters[0].id);
    else { progEmoji.textContent='—'; progLabel.textContent='Selecione um personagem'; renderRail(); }
  }
  updateCounter();
}

function selectChar(id) {
  activeId = id;
  document.querySelectorAll('.char-thumb').forEach(t => t.classList.remove('active'));
  document.getElementById('th-'+id)?.classList.add('active');
  document.querySelectorAll('.sprite').forEach(s => s.classList.remove('active-sprite'));
  const ch = getChar(id);
  if (ch) { ch.sprite.classList.add('active-sprite'); progEmoji.textContent = ch.emoji; progLabel.textContent = 'Sequência de ' + ch.emoji; }
  renderRail();
}

function getChar(id) { return characters.find(c => c.id === id); }
function activeChar() { return getChar(activeId); }
function updateCounter() { counterEl.textContent = characters.length + (characters.length === 1 ? ' personagem' : ' personagens'); }

/* ═══════════════════════════════════════════
   DRAG → RAIL
═══════════════════════════════════════════ */
railEl.addEventListener('dragover', e => { e.preventDefault(); railEl.classList.add('drag-over'); });
railEl.addEventListener('dragleave', () => railEl.classList.remove('drag-over'));
railEl.addEventListener('drop', e => {
  e.preventDefault(); railEl.classList.remove('drag-over');
  if (dragBlockId && activeId) pushBlock(activeId, dragBlockId);
  dragBlockId = null;
});

function pushBlock(charId, blockId) {
  const ch = getChar(charId);
  const bd = BLOCKS_DEF.find(b => b.id === blockId);
  if (!ch || !bd) return;
  ch.sequence.push({ id: blockId, cat: bd.cat, icon: bd.icon, label: bd.label });
  renderRail();
}

/* ═══════════════════════════════════════════
   RENDER RAIL
═══════════════════════════════════════════ */
function renderRail() {
  railEl.innerHTML = '';
  const ch = activeChar();
  if (!ch || ch.sequence.length === 0) {
    railEl.innerHTML = '<span id="rail-hint">⬅ Arraste blocos aqui para programar!</span>';
    return;
  }
  ch.sequence.forEach((item, i) => {
    const d = document.createElement('div');
    d.className = `rblk ${item.cat}`;
    d.innerHTML = `<span class="rblk-icon">${item.icon}</span><span class="rblk-label">${item.label}</span><button class="rblk-del" data-i="${i}">✕</button>`;
    railEl.appendChild(d);
  });
  railEl.querySelectorAll('.rblk-del').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const ch = activeChar();
      if (ch) { ch.sequence.splice(parseInt(b.dataset.i), 1); renderRail(); }
    });
  });
}

document.getElementById('btn-clear').addEventListener('click', () => {
  const ch = activeChar(); if (ch) { ch.sequence = []; renderRail(); }
});

/* ═══════════════════════════════════════════
   SPRITE HELPERS
═══════════════════════════════════════════ */
function place(ch) {
  const sw = stageEl.offsetWidth, sh = stageEl.offsetHeight, sz = 80;
  ch.x = Math.max(0, Math.min(sw-sz, ch.x));
  ch.y = Math.max(0, Math.min(sh-sz, ch.y));
  ch.sprite.style.left = ch.x + 'px';
  ch.sprite.style.top  = ch.y + 'px';
  ch.sprite.style.fontSize = Math.round(56 * ch.scale) + 'px';
  ch.sprite.style.visibility = ch.visible ? 'visible' : 'hidden';
}
window.addEventListener('resize', () => characters.forEach(place));

function anim(sprite, cls, dur) {
  return new Promise(res => {
    sprite.classList.remove(cls); void sprite.offsetWidth;
    sprite.classList.add(cls);
    setTimeout(() => { sprite.classList.remove(cls); res(); }, dur);
  });
}
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function speech(ch, text) {
  ch.sprite.querySelectorAll('.bubble').forEach(b => b.remove());
  clearTimeout(speechTimers[ch.id]);
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  ch.sprite.appendChild(b);
  speechTimers[ch.id] = setTimeout(() => b.remove(), 2400);
}

/* ═══════════════════════════════════════════
   EXECUTE COMMAND
═══════════════════════════════════════════ */
async function exec(ch, id) {
  const spd = parseInt(speedEl.value);
  const step = Math.round(130/spd), dur = Math.round(320/spd);
  switch(id) {
    // TRIGGER - noop in run loop
    case 'on-start': case 'on-tap': break;
    // MOTION
    case 'mv-right': ch.x += step; place(ch); await wait(dur); break;
    case 'mv-left':  ch.x -= step; place(ch); await wait(dur); break;
    case 'mv-up':    ch.y -= step; place(ch); await wait(dur); break;
    case 'mv-down':  ch.y += step; place(ch); await wait(dur); break;
    case 'mv-home':  ch.x=ch.sx; ch.y=ch.sy; place(ch); await wait(dur); break;
    // LOOK
    case 'lk-grow':   ch.scale=Math.min(ch.scale+.3,3); await anim(ch.sprite,'anim-grow',400); place(ch); break;
    case 'lk-shrink': ch.scale=Math.max(ch.scale-.3,.3); await anim(ch.sprite,'anim-grow',400); place(ch); break;
    case 'lk-spin':   await anim(ch.sprite,'anim-spin',500); break;
    case 'lk-bounce': await anim(ch.sprite,'anim-bounce',400); break;
    case 'lk-shake':  await anim(ch.sprite,'anim-shake',400); break;
    case 'lk-hide':   ch.visible=false; place(ch); await wait(200); break;
    case 'lk-show':   ch.visible=true;  place(ch); await wait(200); break;
    // SOUND
    case 'say-oi':    speech(ch,'Oi! 👋'); await wait(1800); break;
    case 'say-eba':   speech(ch,'Eba! 🎉'); await wait(1800); break;
    case 'say-tchau': speech(ch,'Tchau! 😊'); await wait(1800); break;
    case 'say-amor':  speech(ch,'Amigo! ❤️'); await wait(1800); break;
    // CONTROL
    case 'ct-wait': await wait(Math.round(700/spd)); break;
    case 'ct-rep2': return {repeat:2};
    case 'ct-rep3': return {repeat:3};
    case 'ct-rep5': return {repeat:5};
    // END
    case 'en-stop': return {stop:true};
    case 'en-happy': speech(ch,'🎊 Yay!'); await anim(ch.sprite,'anim-bounce',400); break;
    // COLLIDE (reactive, handled separately)
    case 'co-bounce': case 'co-spin': case 'co-say': case 'co-grow': break;
  }
  return null;
}

/* ═══════════════════════════════════════════
   COLLISION
═══════════════════════════════════════════ */
function hitbox(ch) {
  const s = 80 * ch.scale;
  return {x:ch.x+s*.1, y:ch.y+s*.1, w:s*.8, h:s*.8};
}
function overlaps(a, b) {
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

function checkCollisions() {
  for (let i=0;i<characters.length;i++) {
    for (let j=i+1;j<characters.length;j++) {
      const a=characters[i], b=characters[j];
      if (!a.visible || !b.visible) continue;
      const key = a.id+'|'+b.id;
      if (overlaps(hitbox(a),hitbox(b))) {
        if (!collideHandled.has(key)) { collideHandled.add(key); onCollide(a,b); }
      } else { collideHandled.delete(key); }
    }
  }
}

async function onCollide(a, b) {
  a.sprite.classList.add('collide-flash'); b.sprite.classList.add('collide-flash');
  setTimeout(()=>{ a.sprite.classList.remove('collide-flash'); b.sprite.classList.remove('collide-flash'); }, 1000);
  // burst stars
  const mx = (a.x+b.x)/2+40, my = (a.y+b.y)/2+40;
  ['✨','⭐','💥','🌟','⚡'].forEach((s,i)=>{
    const el=document.createElement('div'); el.className='star-burst'; el.textContent=s;
    const ang=(i/5)*Math.PI*2, dist=50+Math.random()*30;
    el.style.left=mx+'px'; el.style.top=my+'px'; stageEl.appendChild(el);
    requestAnimationFrame(()=>{ el.style.left=(mx+Math.cos(ang)*dist)+'px'; el.style.top=(my+Math.sin(ang)*dist)+'px'; el.style.opacity='0'; });
    setTimeout(()=>el.remove(),650);
  });
  for (const ch of [a,b]) {
    const act = ch.sequence.find(s=>s.id.startsWith('co-'));
    if (!act) continue;
    if (act.id==='co-bounce') await anim(ch.sprite,'anim-bounce',400);
    if (act.id==='co-spin')   await anim(ch.sprite,'anim-spin',500);
    if (act.id==='co-say')    speech(ch,'Oi! 👋');
    if (act.id==='co-grow')   { ch.scale=Math.min(ch.scale+.3,3); await anim(ch.sprite,'anim-grow',400); place(ch); }
  }
}

/* ═══════════════════════════════════════════
   RUN CHARACTER
═══════════════════════════════════════════ */
async function runChar(ch) {
  const isActive = ch.id === activeId;
  const railBlocks = isActive ? railEl.querySelectorAll('.rblk') : [];

  // Expand repeats
  const expanded = [];
  for (const item of ch.sequence) {
    if (['ct-rep2','ct-rep3','ct-rep5'].includes(item.id)) {
      const times = item.id==='ct-rep2'?1:item.id==='ct-rep3'?2:4;
      if (expanded.length>0) for(let t=0;t<times;t++) expanded.push({...expanded[expanded.length-1]});
    } else { expanded.push(item); }
  }

  for (let i=0; i<ch.sequence.length; i++) {
    if (stopFlag) break;
    if (isActive) { railBlocks.forEach(b=>b.classList.remove('step-active')); railBlocks[i]?.classList.add('step-active'); }
    const res = await exec(ch, ch.sequence[i].id);
    if (res?.stop || stopFlag) break;
  }
  if (isActive) railBlocks.forEach(b=>b.classList.remove('step-active'));
}

/* ═══════════════════════════════════════════
   CONTROLS
═══════════════════════════════════════════ */
let colInterval = null;
document.getElementById('btn-run').addEventListener('click', async () => {
  if (isRunning) return;
  if (!characters.length) return;
  isRunning=true; stopFlag=false;
  collideHandled.clear();
  colInterval = setInterval(checkCollisions, 60);
  await Promise.all(characters.map(ch=>runChar(ch)));
  clearInterval(colInterval); colInterval=null;
  isRunning=false;
});
document.getElementById('btn-stop').addEventListener('click', ()=>{ stopFlag=true; clearInterval(colInterval); colInterval=null; });
document.getElementById('btn-reset').addEventListener('click', ()=>{
  stopFlag=true; clearInterval(colInterval); colInterval=null; isRunning=false;
  collideHandled.clear();
  characters.forEach(ch=>{ ch.x=ch.sx; ch.y=ch.sy; ch.scale=1; ch.visible=true; place(ch); ch.sprite.querySelectorAll('.bubble').forEach(b=>b.remove()); });
  stageEl.querySelectorAll('.star-burst').forEach(e=>e.remove());
});

/* ═══════════════════════════════════════════
   DRAG SPRITE ON STAGE
═══════════════════════════════════════════ */
(function(){
  let drag=null, ox=0, oy=0;
  stageEl.addEventListener('mousedown', e => {
    const sp = e.target.closest('.sprite'); if(!sp) return;
    const ch = characters.find(c=>c.sprite===sp); if(!ch) return;
    drag=ch; const r=stageEl.getBoundingClientRect(); ox=e.clientX-r.left-ch.x; oy=e.clientY-r.top-ch.y;
    selectChar(ch.id); e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!drag) return;
    const r=stageEl.getBoundingClientRect(); drag.x=e.clientX-r.left-ox; drag.y=e.clientY-r.top-oy;
    drag.sx=drag.x; drag.sy=drag.y; place(drag);
  });
  document.addEventListener('mouseup',()=>drag=null);
})();

/* ═══════════════════════════════════════════
   TOUCH DRAG FROM PALETTE
═══════════════════════════════════════════ */
let tCmd=null, ghostEl=null;
blockListEl.addEventListener('touchstart', e=>{
  const blk=e.target.closest('.blk'); if(!blk) return;
  tCmd=blk.dataset.id;
  ghostEl=blk.cloneNode(true); ghostEl.style.cssText='position:fixed;opacity:.85;pointer-events:none;z-index:999;width:80px;height:70px;border-radius:14px;';
  document.body.appendChild(ghostEl);
},{passive:true});
document.addEventListener('touchmove', e=>{
  if(!ghostEl) return; const t=e.touches[0];
  ghostEl.style.left=(t.clientX-40)+'px'; ghostEl.style.top=(t.clientY-35)+'px';
},{passive:true});
document.addEventListener('touchend', e=>{
  if(!ghostEl||!tCmd) return; ghostEl.remove(); ghostEl=null;
  const t=e.changedTouches[0]; const el=document.elementFromPoint(t.clientX,t.clientY);
  if(el&&(el===railEl||railEl.contains(el))) pushBlock(activeId,tCmd);
  tCmd=null;
},{passive:true});
</script>
